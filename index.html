<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 詳細記錄</title>
  <script src="https://d.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; }
    .header p  { font-size: 13px; opacity: 0.9; margin-top: 4px; }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 14px;
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
    }

    .summary-item {
      background: white;
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .summary-item label { display: block; font-size: 10px; color: #999; margin-bottom: 4px; }
    .summary-item .val  { font-size: 16px; font-weight: bold; color: #333; }
    .summary-item.balance .val { color: #667eea; }
    .summary-item.income  .val { color: #22c55e; }
    .summary-item.expense .val { color: #ef4444; }

    .filters {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #e9ecef;
    }
    .filter-btn {
      flex: 1;
      padding: 7px;
      border: 1px solid #d0d0d0;
      background: white;
      border-radius: 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-color: #667eea;
    }

    .records {
      overflow-y: auto;
      max-height: 55vh;
    }
    .record-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
    }
    .record-left  { flex: 1; }
    .record-date  { font-weight: 600; color: #333; }
    .record-remark { font-size: 11px; color: #aaa; margin-top: 2px; }
    .record-amt   { min-width: 55px; text-align: right; font-weight: bold; font-size: 14px; margin-right: 10px; }
    .record-bal   { min-width: 45px; text-align: right; font-size: 12px; color: #667eea; font-weight: 600; }
    .income  { color: #22c55e; }
    .expense { color: #ef4444; }

    .empty { text-align: center; padding: 40px 20px; color: #bbb; }
    .empty-icon { font-size: 40px; margin-bottom: 8px; }

    .loading { text-align: center; padding: 40px; color: #aaa; }
    .error {
      margin: 14px;
      padding: 14px;
      background: #f8d7da;
      color: #721c24;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }

    .footer {
      padding: 10px;
      text-align: center;
      font-size: 11px;
      color: #bbb;
      background: #f8f9fa;
      border-top: 1px solid #e9ecef;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📊 詳細記錄</h1>
    <p id="userName">載入中...</p>
  </div>

  <div class="summary">
    <div class="summary-item balance">
      <label>餘額</label>
      <div class="val" id="balance">-</div>
    </div>
    <div class="summary-item income">
      <label>總收入</label>
      <div class="val" id="totalIncome">-</div>
    </div>
    <div class="summary-item expense">
      <label>總支出</label>
      <div class="val" id="totalExpense">-</div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
    <button class="filter-btn" onclick="setFilter('month', this)">本月</button>
    <button class="filter-btn" onclick="setFilter('week', this)">本周</button>
  </div>

  <div class="records" id="records">
    <div class="loading">🔄 載入中...</div>
  </div>

  <div class="footer">💡 點擊篩選查看不同時段記錄</div>
</div>

<script>
  // ====== 設定 ======
  // ⬇️ 填入你的 Apps Script Web App URL
  const API_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL';
  // ⬇️ 填入你的 LIFF ID
  const LIFF_ID  = 'YOUR_LIFF_ID';

  // ======
  let allRecords = [];
  let currentFilter = 'all';

  async function init() {
    try {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const userId = liff.getContext().userId;
      if (!userId) {
        showError('無法取得用戶 ID，請從 LINE 開啟此頁面');
        return;
      }

      const res = await fetch(API_URL + '?action=getUserData&userId=' + userId);
      const result = await res.json();

      if (!result.success) {
        showError(result.error || '查詢失敗');
        return;
      }

      renderPage(result.data);
    } catch (err) {
      showError('初始化錯誤：' + err.message);
    }
  }

  function renderPage(data) {
    document.getElementById('userName').textContent = '👤 ' + data.name;
    document.getElementById('balance').textContent   = data.currentBalance;
    document.getElementById('totalIncome').textContent  = '+' + data.totalIncome;
    document.getElementById('totalExpense').textContent = '-' + data.totalExpense;
    allRecords = data.records;
    renderRecords();
  }

  function renderRecords() {
    const now = new Date();
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    const filtered = allRecords.filter(r => {
      const d = new Date(r.date);
      if (currentFilter === 'month') return d >= startOfMonth;
      if (currentFilter === 'week')  return d >= sevenDaysAgo;
      return true;
    });

    // 重新計算篩選後的統計
    const inc = filtered.reduce((s, r) => s + r.income, 0);
    const exp = filtered.reduce((s, r) => s + r.expense, 0);
    const bal = filtered.length > 0 ? filtered[filtered.length - 1].balance : 0;
    document.getElementById('balance').textContent      = bal;
    document.getElementById('totalIncome').textContent  = '+' + inc;
    document.getElementById('totalExpense').textContent = '-' + exp;

    const container = document.getElementById('records');
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>此時段無記錄</p></div>';
      return;
    }

    container.innerHTML = [...filtered].reverse().map(r => {
      const dateStr = new Date(r.date).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
      const isIncome = r.income > 0;
      const amt = isIncome ? r.income : r.expense;
      const sign = isIncome ? '+' : '-';
      const cls  = isIncome ? 'income' : 'expense';
      return `
        <div class="record-item">
          <div class="record-left">
            <div class="record-date">${dateStr}</div>
            <div class="record-remark">${r.remark || '無備註'}</div>
          </div>
          <div class="record-amt ${cls}">${sign}${amt}</div>
          <div class="record-bal">${r.balance}</div>
        </div>`;
    }).join('');
  }

  function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderRecords();
  }

  function showError(msg) {
    document.getElementById('records').innerHTML = '<div class="error">⚠️ ' + msg + '</div>';
    document.getElementById('userName').textContent = '發生錯誤';
  }

  init();
</script>
</body>
</html>
